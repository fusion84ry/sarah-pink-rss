name: Update Tim Ingold RSS

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tim-ingold-rss
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Tim Ingold RSS
        run: python generate_ingold.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tim-ingold.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update Tim Ingold ORCID RSS feed"
            git push
          fi
